<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ASCII lab . hehe v02</title>
<meta name="description" content="ASCII lab (hehe v02) — a tiny, single-file ASCII art converter. Runs entirely in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d11'/%3E%3Ctext x='32' y='43' font-family='monospace' font-size='28' fill='%237dd3fc' text-anchor='middle'%3E@%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg-app: #0c0c0d;
    --bg-panel: #111113;
    --bg-control: #1a1a1d;
    --bg-active: #2e2e33;
    --bg-pop: #161618;
    --line: #232326;
    --text: #ededee;
    --muted: #8e8e93;
    --accent: #7dd3fc;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg-app);
    color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  [hidden] { display: none !important; }

  button, input, select { font: inherit; color: inherit; }

  button { -webkit-tap-highlight-color: transparent; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 30;
    height: 48px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-app);
  }

  .brand {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }

  .brand .version {
    color: var(--muted);
    font-weight: 400;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .text-btn {
    height: 30px;
    padding: 0 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .text-btn:hover { background: var(--bg-control); }

  .menu { position: relative; }
  .menu summary { list-style: none; }
  .menu summary::-webkit-details-marker { display: none; }
  .menu[open] summary.text-btn { background: var(--bg-control); }

  .menu-pop {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 150px;
    padding: 4px;
    display: grid;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg-pop);
  }

  .menu-pop button {
    height: 30px;
    padding: 0 8px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }

  .menu-pop button:hover { background: var(--bg-control); }

  .menu-sep { height: 1px; margin: 4px 0; background: var(--line); }

  .panel {
    position: fixed;
    top: 48px;
    bottom: 0;
    left: 0;
    z-index: 20;
    width: 280px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-panel);
    border-right: 1px solid var(--line);
  }

  .panel-grip { display: none; }

  .seg.panel-tabs {
    flex: none;
    margin: 12px 16px 0;
  }

  .panel-tabs button {
    padding: 0 8px;
    font-size: 12px;
  }

  .panel-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scrollbar-width: thin;
    scrollbar-color: #2a2a2e transparent;
  }

  .panel-body::-webkit-scrollbar { width: 8px; }
  .panel-body::-webkit-scrollbar-thumb {
    background: #2a2a2e;
    border-radius: 999px;
  }

  .section {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }

  .section h2 {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
  }

  .section--look {
    position: relative;
    z-index: 5;
    display: block;
  }

  .section--bg,
  .section--tone {
    display: block;
  }

  .section--bg h2 {
    margin: 0 0 8px;
  }

  .section--tone h2 {
    margin: 0 0 4px;
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .section-head h2 { margin: 0; }

  .section--grade > .section-head { margin-bottom: 0; }

  .look-name {
    font-size: 12px;
    color: var(--muted);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .look-grid {
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    gap: 4px;
  }

  .look-btn,
  .look-more {
    display: grid;
    place-items: center;
    min-width: 0;
    height: 28px;
    padding: 0;
    border: 0;
    border-radius: 4px;
    background: var(--look-bg, var(--bg-control));
    color: var(--look-fg, var(--text));
    font: 13px/1 "IBM Plex Mono", ui-monospace, Menlo, monospace;
    cursor: pointer;
  }

  .look-btn[aria-pressed="true"],
  .look-more.has-active {
    box-shadow: 0 0 0 1.5px var(--accent);
  }

  .look-more { background: var(--bg-control); color: var(--text); }
  .look-more svg { display: block; }

  .look-more-pop {
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 6px;
    min-width: 164px;
    max-height: 220px;
    overflow-y: auto;
    padding: 4px;
    display: grid;
    gap: 2px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg-pop);
    z-index: 6;
  }

  .look-more-pop button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 30px;
    padding: 0 6px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }

  .look-more-pop button:hover { background: var(--bg-control); }
  .look-more-pop button[aria-pressed="true"] { background: var(--bg-active); }

  .look-swatch {
    flex: 0 0 20px;
    display: grid;
    place-items: center;
    height: 20px;
    border-radius: 3px;
    background: var(--look-bg);
    color: var(--look-fg);
    font: 11px/1 "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }

  .stack {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .row-label {
    flex: 0 0 64px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .row-label--strong {
    font-weight: 600;
    color: var(--text);
  }

  .slider {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }

  .slider-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 18px;
  }

  .slider-head .row-label {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .slider input[type="range"] {
    --fill: 0%;
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 18px;
    margin: 0;
    background: transparent;
    cursor: pointer;
  }

  .slider input[type="range"]::-webkit-slider-runnable-track {
    height: 2px;
    border-radius: 999px;
    background: linear-gradient(to right, var(--accent) 0 var(--fill), var(--bg-active) var(--fill) 100%);
  }

  .slider input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 10px;
    height: 10px;
    margin-top: -4px;
    border: 0;
    border-radius: 50%;
    background: var(--accent);
  }

  .slider input[type="range"]::-moz-range-track {
    height: 2px;
    border-radius: 999px;
    background: var(--bg-active);
  }

  .slider input[type="range"]::-moz-range-progress {
    height: 2px;
    border-radius: 999px;
    background: var(--accent);
  }

  .slider input[type="range"]::-moz-range-thumb {
    width: 10px;
    height: 10px;
    border: 0;
    border-radius: 50%;
    background: var(--accent);
  }

  .num-input {
    flex: 0 0 40px;
    box-sizing: border-box;
    width: 40px;
    height: 18px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: 11.5px/1.5 "IBM Plex Mono", ui-monospace, Menlo, monospace;
    text-align: right;
    appearance: textfield;
    -moz-appearance: textfield;
  }

  .num-input::-webkit-outer-spin-button,
  .num-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .select {
    flex: 1;
    min-width: 0;
    height: 30px;
    padding: 0 8px;
    border: 0;
    border-radius: 6px;
    background: var(--bg-control);
    color: var(--text);
    font-size: 13px;
  }

  .select option { background: var(--bg-control); color: var(--text); }

  .text-input {
    flex: 1;
    min-width: 0;
    height: 30px;
    padding: 0 8px;
    border: 0;
    border-radius: 6px;
    background: var(--bg-control);
    color: var(--text);
    font: 12.5px/1 "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }

  .chips {
    display: flex;
    gap: 4px;
  }

  .chip {
    flex: 1 1 0;
    height: 28px;
    border: 0;
    border-radius: 6px;
    background: var(--bg-control);
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
  }

  .chip[aria-pressed="true"] {
    background: var(--bg-active);
    color: var(--text);
  }

  .seg-row {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }

  .seg {
    flex: 1;
    min-width: 0;
    display: flex;
    gap: 2px;
    padding: 2px;
    border-radius: 6px;
    background: var(--bg-control);
  }

  .seg button {
    flex: 1 1 0;
    min-width: 0;
    height: 26px;
    padding: 0 1px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .seg button[aria-pressed="true"],
  .seg button[aria-selected="true"] {
    background: var(--bg-active);
    color: var(--text);
  }

  .color-row {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 30px;
  }

  .color-row .row-label {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .color-code {
    color: var(--muted);
    font: 11.5px/1 "IBM Plex Mono", ui-monospace, Menlo, monospace;
    text-transform: uppercase;
  }

  .filter-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
  }

  .filter-chip {
    display: block;
    min-width: 0;
    height: 28px;
    padding: 0 4px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }

  .filter-chip[aria-pressed="true"] {
    border-color: transparent;
    background: var(--bg-active);
    color: var(--text);
  }

  .switch {
    position: relative;
    flex: 0 0 34px;
    width: 34px;
    height: 18px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg-control);
    cursor: pointer;
    transition: background-color .15s ease;
  }

  .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--muted);
    transition: transform .15s ease, background-color .15s ease;
  }

  .switch[aria-checked="true"] {
    background: var(--bg-active);
  }

  .switch[aria-checked="true"]::after {
    background: var(--text);
    transform: translateX(16px);
  }

  input[type="color"] {
    flex: 0 0 30px;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
  }

  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 6px; }
  input[type="color"]::-moz-color-swatch { border: 0; border-radius: 6px; }

  .advanced-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 28px;
    margin-top: 2px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
  }

  .advanced-toggle .chev {
    width: 6px;
    height: 6px;
    margin-right: 4px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(45deg);
    transition: transform 0.2s;
  }

  .advanced-toggle[aria-expanded="true"] .chev { transform: rotate(225deg); }

  #gaussianRows { margin-top: 4px; }

  #advancedBody .chips { margin-top: 6px; }

  .reset-all {
    align-self: flex-start;
    height: 28px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }

  #stage {
    position: fixed;
    top: 48px;
    left: 280px;
    right: 0;
    bottom: 0;
    background: var(--bg-app);
  }

  #viewport {
    position: absolute;
    inset: 0;
    padding: 24px;
    display: grid;
    place-items: center;
    overflow: hidden;
    touch-action: none;
  }

  #canvas {
    display: block;
    width: 320px;
    height: 200px;
    background: #000;
    transform-origin: center center;
    touch-action: none;
    cursor: grab;
    will-change: transform;
  }

  #canvas:active { cursor: grabbing; }

  #canvas.is-transparent {
    background-color: #101319;
    background-image:
      linear-gradient(45deg, rgba(255, 255, 255, 0.07) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.07) 75%),
      linear-gradient(45deg, rgba(255, 255, 255, 0.07) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.07) 75%);
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
  }

  #empty {
    position: absolute;
    inset: 0;
    z-index: 5;
    padding: 24px;
    display: grid;
    place-items: center;
    pointer-events: none;
  }

  .empty-content {
    pointer-events: auto;
    width: min(320px, 100%);
    text-align: center;
  }

  .empty-content h1 {
    margin: 0 0 6px;
    font-size: 18px;
    font-weight: 600;
  }

  .empty-content p {
    margin: 0 0 16px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--muted);
  }

  .empty-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
  }

  .empty-btn {
    height: 32px;
    padding: 0 14px;
    border: 0;
    border-radius: 6px;
    background: var(--bg-control);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }

  .empty-btn.primary {
    background: var(--accent);
    color: #06131b;
    font-weight: 550;
  }

  #dropVeil {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: grid;
    place-items: center;
    background: rgba(12, 12, 13, 0.88);
  }

  .veil-frame {
    padding: 32px 44px;
    border-radius: 8px;
    border: 1px dashed #8e8e93;
    font-size: 14px;
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    z-index: 70;
    max-width: calc(100% - 32px);
    box-sizing: border-box;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg-pop);
    font-size: 13px;
    text-align: center;
    transform: translateX(-50%);
  }

  #toast[data-kind="error"] {
    border-color: rgba(248, 113, 113, 0.55);
    color: #fecaca;
  }

  @media (max-width: 760px) {
    .topbar { height: 44px; }

    #stage {
      top: 44px;
      left: 0;
      bottom: 44px;
    }

    #viewport, #empty { padding: 12px; }

    .panel {
      top: auto;
      left: 0;
      right: 0;
      bottom: 0;
      width: auto;
      height: min(388px, 46vh);
      border-right: 0;
      border-top: 1px solid var(--line);
      transition: transform 0.2s ease;
    }

    .panel.is-collapsed { transform: translateY(calc(100% - 44px)); }

    .panel-grip {
      display: flex;
      flex: 0 0 44px;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 44px;
      padding: 0 16px;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .panel-grip .chev {
      width: 6px;
      height: 6px;
      border-right: 1.5px solid var(--muted);
      border-bottom: 1.5px solid var(--muted);
      transform: rotate(225deg);
      transition: transform 0.2s;
    }

    .panel-grip[aria-expanded="true"] .chev { transform: rotate(45deg); }

    #toast { bottom: 56px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition: none !important;
      animation: none !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">ASCII lab <span class="version">. hehe v02</span></div>
  <div class="actions">
    <button type="button" class="text-btn" data-action="open">Open</button>
    <details class="menu" id="exportMenu">
      <summary class="text-btn">Export</summary>
      <div class="menu-pop">
        <button type="button" data-action="png1">PNG 1×</button>
        <button type="button" data-action="png2">PNG 2×</button>
        <button type="button" data-action="jpg">JPG</button>
        <button type="button" data-action="svg">SVG</button>
        <div class="menu-sep" role="separator"></div>
        <button type="button" data-action="txt">TXT file</button>
        <button type="button" data-action="copy">Copy ASCII</button>
      </div>
    </details>
  </div>
</header>

<main id="stage">
  <div id="viewport">
    <canvas id="canvas" width="320" height="200" role="img" tabindex="0"
      aria-label="ASCII preview. Open an image or try the demo."></canvas>
  </div>

  <div id="empty">
    <div class="empty-content">
      <h1>Drop an image</h1>
      <p>PNG, JPG, WebP or GIF. Everything stays on your device.</p>
      <div class="empty-actions">
        <button type="button" class="empty-btn primary" data-action="open">Open image</button>
        <button type="button" class="empty-btn" data-action="demo">Try demo</button>
      </div>
    </div>
  </div>

  <div id="dropVeil" hidden>
    <div class="veil-frame">Drop to render</div>
  </div>
</main>

<aside class="panel" id="panel" aria-label="Controls">
  <button type="button" class="panel-grip" id="panelGrip" aria-expanded="true" aria-controls="panelBody">
    <span id="gripText">Controls · Chars</span>
    <span class="chev" aria-hidden="true"></span>
  </button>
  <div class="seg panel-tabs" role="tablist" aria-label="Panel tabs">
    <button type="button" role="tab" id="tabRender" data-tab="render" aria-selected="true"
      aria-controls="lookSection effectSection bgSection toneSection" tabindex="0">Render</button>
    <button type="button" role="tab" id="tabColor" data-tab="color" aria-selected="false"
      aria-controls="gradeSection" tabindex="-1">Color</button>
  </div>
  <div class="panel-body" id="panelBody">
    <section class="section section--look" id="lookSection" aria-labelledby="lookHead" data-tab="render">
      <div class="section-head">
        <h2 id="lookHead">Look</h2>
        <span class="look-name" id="lookName">Custom</span>
      </div>
      <div class="look-grid" id="lookGrid"></div>
      <div class="look-more-pop" id="lookMore" aria-label="More looks" hidden></div>
    </section>

    <section class="section" aria-label="Effect" id="effectSection" data-tab="render">
      <div class="row">
        <label for="effect" class="row-label row-label--strong">Effect</label>
        <select class="select" id="effect">
          <option value="chars">Chars</option>
          <option value="braille">Braille</option>
          <option value="block">Block</option>
          <option value="pixel">Pixel</option>
          <option value="dither">Dither</option>
          <option value="halftone">Halftone</option>
        </select>
      </div>

      <div class="stack" id="charsControls">
        <div class="row">

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);

  }

  function downloadUrl(url, filename) {
    const link = document.createElement('a');

    link.download = filename;
    document.body.appendChild(link);

  }

  const XML_ESCAPE = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' };
  const escapeXml = (value) => String(value).replace(/[&<>"']/g, (char) => XML_ESCAPE[char]);
  const fixed = (value) => String(Math.round(value * 100) / 100);

  /* ---------- tone ---------- */

  function makeTone(state) {
    const gain = 1 + state.contrast / 100;
    const lift = state.brightness / 100;
    const gamma = Math.max(0.05, state.gamma / 100);
    const lut = new Float32Array(256);

    for (let i = 0; i < 256; i++) {
      let v = (i / 255 - 0.5) * gain + 0.5 + lift;
      v = v < 0 ? 0 : v > 1 ? 1 : v;
      v = Math.pow(v, 1 / gamma);
      v = v < 0 ? 0 : v > 1 ? 1 : v;
      lut[i] = state.invert ? 1 - v : v;
    }
    return lut;
  }

  /* ---------- draw primitives ---------- */

  const BAYER = { 2: [0, 2, 3, 1] };
  for (const size of [4, 8, 16]) {
    const half = size / 2;
    BAYER[size] = Array.from({ length: size * size }, (_, i) => {
      const x = i % size;
      const y = Math.floor(i / size);
      return 4 * BAYER[half][(y % half) * half + (x % half)] + BAYER[2][Math.floor(y / half) * 2 + Math.floor(x / half)];
    });
  }

  const sampler = document.createElement('canvas');
  const samplerCtx = sampler.getContext('2d', { willReadFrequently: true });

  function sample(image, width, height) {
    const { w: iw, h: ih } = sourceSize(image);
    sampler.width = Math.max(1, width);
    sampler.height = Math.max(1, height);
    samplerCtx.clearRect(0, 0, sampler.width, sampler.height);
    samplerCtx.imageSmoothingEnabled = true;
    samplerCtx.imageSmoothingQuality = 'high';
    samplerCtx.drawImage(image, 0, 0, iw, ih, 0, 0, sampler.width, sampler.height);
    return samplerCtx.getImageData(0, 0, sampler.width, sampler.height).data;
  }

  function sampleNearest(image, width, height) {
    const { w: iw, h: ih } = sourceSize(image);
    sampler.width = Math.max(1, width);
    sampler.height = Math.max(1, height);
    samplerCtx.clearRect(0, 0, sampler.width, sampler.height);
    samplerCtx.imageSmoothingEnabled = false;
    samplerCtx.drawImage(image, 0, 0, iw, ih, 0, 0, sampler.width, sampler.height);
    return samplerCtx.getImageData(0, 0, sampler.width, sampler.height).data;
  }

  function hexRgb(hex) {
    const match = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    const value = match ? parseInt(match[1], 16) : 0;
    return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
  }

  function colorRgb(state, r, g, b, luma) {
    if (state.palette === 'mono') {
      const v = Math.round(16 + luma * 224);
      return [v, v, v];
    }
    if (state.palette === 'tint') {
      const from = state.bgTransparent ? { r: 0, g: 0, b: 0 } : hexRgb(state.bg);
      const to = hexRgb(state.tintColor);
      const t = 0.15 + 0.85 * clamp(luma, 0, 1);
      return [
        Math.round(from.r + (to.r - from.r) * t),
        Math.round(from.g + (to.g - from.g) * t),
        Math.round(from.b + (to.b - from.b) * t),
      ];
    }
    return [r | 0, g | 0, b | 0];
  }

  function makeColorer(state) {
    return (r, g, b, luma) => {
      const [cr, cg, cb] = colorRgb(state, r, g, b, luma);
      return `rgb(${cr},${cg},${cb})`;
    };
  }

  function hexToRgba(hex, alpha) {
    const { r, g, b } = hexRgb(hex);

  }

  function drawCover(ctx, source, width, height) {
    const { w: iw, h: ih } = sourceSize(source);
    const scale = Math.max(width / iw, height / ih);
    const w = iw * scale;
    const h = ih * scale;
    ctx.drawImage(source, (width - w) / 2, (height - h) / 2, w, h);

  function paintBackdrop(ctx, image, state, width, height, unit) {
    const backdrop = state.backdrop === 'image' && Boolean(image);

      ctx.fillStyle = state.bg;
      ctx.fillRect(0, 0, width, height);

    drawCover(ctx, image, width, height);
    if (typeof ctx.filter === 'string') ctx.filter = 'none';
    ctx.fillStyle = hexToRgba(state.bg, 0.25);
    ctx.fillRect(0, 0, width, height);
    ctx.restore();
  }

  function cellNoise(col, row, seed) {
    let h = Math.imul(col + 0x9e3779b9, 0x85ebca6b) ^ Math.imul(row + 0x7f4a7c15, 0xc2b2ae35) ^ Math.imul(seed + 1, 0x27d4eb2f);
    h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d);
    h ^= h >>> 12;
    return (h >>> 0) / 4294967296;

  function glyphAt(state, chars, last, luma, col, row) {
    const effLuma = state.invertMapping ? 1 - luma : luma;
    let index = (1 - effLuma) * last;
    if (state.randomize && state.randomAmount > 0) {
      const spread = (state.randomAmount / 100) * (last + 1);
      index += (cellNoise(col, row, state.randomSeed) - 0.5) * spread;
    }
    return chars[Math.min(last, Math.max(0, index)) | 0];
  }

  function drawCharacters(ctx, image, state, tone, threshold, grid) {
    const { cols, rows, cellW, cellH, font } = grid;
    const pixels = sample(image, cols, rows);
    const chars = Array.from(state.chars || ' ');
    const last = chars.length - 1;
    const halfW = cellW / 2;
    const halfH = cellH / 2;
    const paint = makeColorer(state);

    ctx.font = font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let row = 0; row < rows; row++) {
      const y = row * cellH + halfH;
      for (let col = 0; col < cols; col++) {
        const offset = (row * cols + col) * 4;
        if (pixels[offset + 3] < 8) continue;

        const r = pixels[offset];
        const g = pixels[offset + 1];
        const b = pixels[offset + 2];
        const luma = tone[(0.299 * r + 0.587 * g + 0.114 * b) | 0];
        if (luma < threshold) continue;

        const glyph = glyphAt(state, chars, last, luma, col, row);
        if (glyph === ' ') continue;

        ctx.fillStyle = paint(r, g, b, luma);
        ctx.fillText(glyph, col * cellW + halfW, y);
      }
    }
  }

  function drawBraille(ctx, image, state, tone, threshold, grid) {
    const { cols, rows, cellW, cellH, font } = grid;
    const sw = cols * 2;
    const sh = rows * 4;
    const pixels = sample(image, sw, sh);
    const halfW = cellW / 2;
    const halfH = cellH / 2;
    const paint = makeColorer(state);

    ctx.font = font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let row = 0; row < rows; row++) {
      const y = row * cellH + halfH;
      for (let col = 0; col < cols; col++) {
        let mask = 0;
        let sr = 0, sg = 0, sb = 0, sum = 0, count = 0;
        for (let dy = 0; dy < 4; dy++) {
          for (let dx = 0; dx < 2; dx++) {
            const offset = ((row * 4 + dy) * sw + col * 2 + dx) * 4;
            if (pixels[offset + 3] < 8) continue;
            const r = pixels[offset];
            const g = pixels[offset + 1];
            const b = pixels[offset + 2];
            const luma = tone[(0.299 * r + 0.587 * g + 0.114 * b) | 0];
            sr += r;
            sg += g;
            sb += b;
            sum += luma;
            count++;
            const effLuma = state.invertMapping ? 1 - luma : luma;
            if (effLuma >= threshold) mask |= BRAILLE_BITS[dy][dx];
          }
        }
        if (!mask || !count) continue;
        const glyph = String.fromCharCode(0x2800 + mask);
        ctx.fillStyle = paint(sr / count, sg / count, sb / count, sum / count);
        ctx.fillText(glyph, col * cellW + halfW, y);
      }
    }
  }

  function ditherCells(image, state, tone, threshold, grid, paint, mask) {
    const sw = grid.cols * 2;
    const sh = grid.rows * 2;
    const dw = grid.cellW / 2;
    const dh = grid.cellH / 2;
    const pixels = sample(image, sw, sh);
    const strength = clamp(Number(state.ditherStrength ?? 100) / 100, 0, 1);
    const algorithm = state.ditherAlgorithm || 'bayer8';
    const diffusion = DIFFUSION[algorithm];
    const chroma = state.ditherChroma || 'standard';
    const perChannel = chroma === 'perChannel';
    const paletteKey = state.ditherPalette;
    const palette = paletteKey && paletteKey !== 'original' ? DITHER_PALETTES[paletteKey] : null;
    const size = algorithm.startsWith('bayer') ? Number(algorithm.slice(5)) || 8 : 8;
    const matrix = BAYER[size] || BAYER[8];

    const grade = (r, g, b, level) => {
      if (chroma === 'luminance') return [level * 255, level * 255, level * 255];
      if (perChannel) return [tone[r] * 255, tone[g] * 255, tone[b] * 255];
      const scale = (level * 255) / Math.max(1, 0.299 * r + 0.587 * g + 0.114 * b);
      return [Math.min(255, r * scale), Math.min(255, g * scale), Math.min(255, b * scale)];
    };

    const litColor = (r, g, b, level) => {
      if (chroma === 'luminance') {
        const v = Math.round(level * 255);
        return colorRgb(state, v, v, v, level);
      }
      return colorRgb(state, r, g, b, level);
    };

    const nearest = (rr, gg, bb) => {
      let best = palette[0];
      let bestDist = Infinity;
      for (const col of palette) {
        const d = chroma === 'luminance'
          ? (0.299 * rr + 0.587 * gg + 0.114 * bb - (0.299 * col[0] + 0.587 * col[1] + 0.114 * col[2])) ** 2
          : (rr - col[0]) ** 2 + (gg - col[1]) ** 2 + (bb - col[2]) ** 2;
        if (d < bestDist) {
          bestDist = d;
          best = col;
        }
      }
      return best;
    };

    const bg = hexRgb(state.bg);
    const paper = palette ? nearest(bg.r, bg.g, bg.b) : null;

    const emit = (idx, x, y, out, on = true) => {
      if (mask && 0.299 * out[0] + 0.587 * out[1] + 0.114 * out[2] >= 128) mask[idx] = 1;
      if (paint && on) paint(x * dw, y * dh, dw + 0.6, dh + 0.6, `rgb(${out[0] | 0},${out[1] | 0},${out[2] | 0})`);
    };

    if (!diffusion) {
      for (let y = 0; y < sh; y++) {
        for (let x = 0; x < sw; x++) {
          const idx = y * sw + x;
          const off = idx * 4;
          if (pixels[off + 3] < 8) continue;
          const r = pixels[off];
          const g = pixels[off + 1];
          const b = pixels[off + 2];
          const level = tone[(0.299 * r + 0.587 * g + 0.114 * b) | 0];
          if (level < threshold) continue;

          const t = algorithm === 'whiteNoise'
            ? cellNoise(x, y, state.randomSeed ?? 7)
            : (matrix[(y % size) * size + (x % size)] + 0.5) / (size * size);
          const bias = (0.5 - t) * 255 * strength;
          const cur = grade(r, g, b, level);
          const qr = clamp(cur[0] + bias, 0, 255);
          const qg = clamp(cur[1] + bias, 0, 255);
          const qb = clamp(cur[2] + bias, 0, 255);
          let out;
          let on;
          if (palette) {
            out = nearest(qr, qg, qb);
            on = out !== paper;
          } else {
            on = 0.299 * qr + 0.587 * qg + 0.114 * qb >= 127.5;
            out = on ? litColor(r, g, b, level) : [0, 0, 0];
          }
          emit(idx, x, y, out, on);
        }
      }
      return;
    }

    const values = new Float32Array(sw * sh * 3);
    for (let i = 0; i < sw * sh; i++) {
      const off = i * 4;
      const r = pixels[off];
      const g = pixels[off + 1];
      const b = pixels[off + 2];
      const level = tone[(0.299 * r + 0.587 * g + 0.114 * b) | 0];
      const graded = grade(r, g, b, level);
      values[i * 3] = graded[0];
      values[i * 3 + 1] = graded[1];
      values[i * 3 + 2] = graded[2];
    }

    for (let y = 0; y < sh; y++) {
      for (let x = 0; x < sw; x++) {
        const idx = y * sw + x;
        const off = idx * 4;
        if (pixels[off + 3] < 8) continue;
        const r = pixels[off];
        const g = pixels[off + 1];
        const b = pixels[off + 2];
        const level = tone[(0.299 * r + 0.587 * g + 0.114 * b) | 0];
        if (level < threshold) continue;

        const curR = clamp(values[idx * 3], 0, 255);
        const curG = clamp(values[idx * 3 + 1], 0, 255);
        const curB = clamp(values[idx * 3 + 2], 0, 255);
        let out;
        let on;
        if (palette) {
          out = nearest(curR, curG, curB);
          on = out !== paper;
        } else {
          on = 0.299 * curR + 0.587 * curG + 0.114 * curB >= 127.5;
          out = on ? litColor(r, g, b, level) : [0, 0, 0];
        }
        emit(idx, x, y, out, on);

        if (strength === 0) continue;
        const errR = (curR - out[0]) * strength;
        const errG = (curG - out[1]) * strength;
        const errB = (curB - out[2]) * strength;
        const monoErr = 0.299 * errR + 0.587 * errG + 0.114 * errB;
        for (const [dx, dy, weight] of diffusion) {
          const nx = x + dx;
          const ny = y + dy;
          if (nx < 0 || nx >= sw || ny >= sh) continue;
          if (pixels[(ny * sw + nx) * 4 + 3] < 8) continue;
          const n = (ny * sw + nx) * 3;
          if (perChannel) {
            values[n] += errR * weight;
            values[n + 1] += errG * weight;
            values[n + 2] += errB * weight;
          } else {
            values[n] += monoErr * weight;
            values[n + 1] += monoErr * weight;
            values[n + 2] += monoErr * weight;
          }
        }
      }
    }
  }

  function drawDither(ctx, image, state, tone, threshold, grid) {
    ditherCells(image, state, tone, threshold, grid, (x, y, w, h, color) => {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
    });
  }

  function drawHalftone(ctx, image, state, tone, threshold, width, height, grid) {
    const pitch = Math.max(2, grid.cellW);
    const dotsW = Math.max(1, Math.floor(width / pitch));
    const dotsH = Math.max(1, Math.floor(height / pitch));
    const pixels = sample(image, dotsW, dotsH);
    const maxR = pitch * 0.62;
    const paint = makeColorer(state);

    for (let y = 0; y < dotsH; y++) {
      for (let x = 0; x < dotsW; x++) {
        const off = (y * dotsW + x) * 4;
        if (pixels[off + 3] < 8) continue;
        const r = pixels[off];
        const g = pixels[off + 1];
        const b = pixels[off + 2];
        const luma = tone[(0.299 * r + 0.587 * g + 0.114 * b) | 0];
        if (luma < threshold) continue;
        ctx.fillStyle = paint(r, g, b, luma);
        ctx.beginPath();
        ctx.arc(x * pitch + pitch / 2, y * pitch + pitch / 2, Math.max(0.35, luma * maxR), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawBlock(ctx, image, state, tone, threshold, grid) {
    const { cols, rows, cellW, cellH } = grid;
    const pixels = sample(image, cols, rows);
    const gap = Math.min(2, cellW * 0.08);
    const paint = makeColorer(state);

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const offset = (row * cols + col) * 4;
        if (pixels[offset + 3] < 8) continue;

        const r = pixels[offset];
        const g = pixels[offset + 1];
        const b = pixels[offset + 2];
        const luma = tone[(0.299 * r + 0.587 * g + 0.114 * b) | 0];
        if (luma < threshold) continue;

        ctx.fillStyle = paint(r, g, b, luma);
        ctx.fillRect(
          col * cellW + gap / 2,
          row * cellH + gap / 2,
          cellW - gap + 0.5,
          cellH - gap + 0.5,
        );
      }
    }
  }

  function ditherThreshold(x, y) {
    return (BAYER[8][(y % 8) * 8 + (x % 8)] + 0.5) / 64;
  }

  function quantizeChannel(value) {
    const level = clamp(Math.floor(value / 255 * 5 + 0.5), 0, 5);
    return Math.round(255 * level / 5);
  }

  function paletteColor(palette, r, g, b, threshold) {
    let first = palette[0];
    let second = null;
    let distFirst = Infinity;
    let distSecond = Infinity;
    for (const color of palette) {
      const dist = (r - color[0]) ** 2 + (g - color[1]) ** 2 + (b - color[2]) ** 2;
      if (dist < distFirst) {
        distSecond = distFirst;
        second = first;
        distFirst = dist;
        first = color;
      } else if (dist < distSecond) {
        distSecond = dist;
        second = color;
      }
    }
    if (!second) return first;

    const vx = second[0] - first[0];
    const vy = second[1] - first[1];
    const vz = second[2] - first[2];
    const length = vx * vx + vy * vy + vz * vz;
    if (!length) return first;
    const mix = clamp(((r - first[0]) * vx + (g - first[1]) * vy + (b - first[2]) * vz) / length, 0, 1);
    return mix > threshold ? second : first;
  }

  function drawPixel(ctx, image, state, tone, threshold, grid) {
    const { cols, rows, cellW, cellH } = grid;
    const pixels = sampleNearest(image, cols, rows);
    const invertColor = Boolean(state.invert) && state.palette === 'source';
    const palette = state.pixelPalette && state.pixelPalette !== 'original' ? DITHER_PALETTES[state.pixelPalette] : null;
    const gap = 1;

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const offset = (row * cols + col) * 4;
        if (pixels[offset + 3] < 8) continue;

        const r = pixels[offset];
        const g = pixels[offset + 1];
        const b = pixels[offset + 2];
        const luma = tone[(0.299 * r + 0.587 * g + 0.114 * b) | 0];
        if (luma < threshold) continue;

        const [cr, cg, cb] = colorRgb(
          state,
          invertColor ? 255 - r : r,
          invertColor ? 255 - g : g,
          invertColor ? 255 - b : b,
          luma,
        );
        const thresholdAt = ditherThreshold(col, row);
        const [qr, qg, qb] = palette
          ? paletteColor(palette, cr, cg, cb, thresholdAt)
          : [quantizeChannel(cr), quantizeChannel(cg), quantizeChannel(cb)];
        ctx.fillStyle = `rgb(${qr},${qg},${qb})`;
        ctx.fillRect(
          col * cellW + gap / 2,
          row * cellH + gap / 2,
          Math.max(0.5, cellW - gap),
          Math.max(0.5, cellH - gap),
        );
      }
    }
  }

  function drawDotGrid(ctx, cols, rows, cellW, cellH, color) {
    ctx.save();
    ctx.fillStyle = color;
    const r = Math.max(0.6, Math.min(cellW, cellH) * 0.08);
    for (let row = 0; row < rows; row++) {
      const y = (row + 0.5) * cellH;
      for (let col = 0; col < cols; col++) {
        const x = (col + 0.5) * cellW;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  /* ---------- renderers ---------- */

  function renderAscii(canvas, image, state, outWidth, outHeight, unit) {
    const started = performance.now();

    const width = Math.max(1, Math.round(outWidth));
    const height = Math.max(1, Math.round(outHeight));
    if (canvas.width !== width) canvas.width = width;
    if (canvas.height !== height) canvas.height = height;

    const ctx = canvas.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const effect = state.effect || 'chars';

    paintBackdrop(ctx, image, state, canvas.width, canvas.height, unit);

    const grid = computeGrid(canvas.width, canvas.height, state, unit);
    const { cols, rows } = grid;

    if (!image) {
      return { cols, rows, ms: performance.now() - started };
    }

    const tone = makeTone(state);
    const threshold = ((100 - state.coverage) / 100) * 0.85;

    const opacity = clamp((state.charOpacity ?? 100) / 100, 0, 1);
    ctx.save();
    ctx.globalAlpha = opacity;
    if (effect === 'braille') drawBraille(ctx, image, state, tone, threshold, grid);
    else if (effect === 'dither') drawDither(ctx, image, state, tone, threshold, grid);
    else if (effect === 'halftone') drawHalftone(ctx, image, state, tone, threshold, canvas.width, canvas.height, grid);
    else if (effect === 'pixel') drawPixel(ctx, image, state, tone, threshold, grid);
    else if (effect === 'block') drawBlock(ctx, image, state, tone, threshold, grid);
    else drawCharacters(ctx, image, state, tone, threshold, grid);
    ctx.restore();

    if (state.dotGrid) {
      const dotColor = state.palette === 'tint' ? hexToRgba(state.tintColor, 0.28) : 'rgba(255, 255, 255, 0.2)';
      drawDotGrid(ctx, cols, rows, grid.cellW, grid.cellH, dotColor);
    }

    return { cols, rows, ms: performance.now() - started };
  }

  let metricsCtx = null;
  function measureCell(font) {
    if (!metricsCtx) {
      metricsCtx = document.createElement('canvas').getContext('2d');
    }
    metricsCtx.font = font;
    return metricsCtx.measureText('M').width;
  }

  function computeGrid(width, height, state, unit) {
    const effect = state.effect || 'chars';
    const scaled = effect === 'dither' || effect === 'halftone' || effect === 'pixel';
    const fontPx = Math.max(3, state.size * unit);
    const font = `${fontPx}px ${effect === 'braille' ? BRAILLE_FONT : GLYPH_FONT}`;
    let cellW = effect === 'dither' || effect === 'pixel'
      ? fontPx
      : effect === 'braille'
        ? Math.max(2, fontPx * 0.6)
        : Math.max(2, measureCell(font));
    let cellH = fontPx;
    const cap = scaled ? MAX_SCALED_CELLS : MAX_CELLS;
    let cols = Math.max(1, Math.floor(width / cellW));
    let rows = Math.max(1, Math.floor(height / cellH));

    while (cols * rows > cap) {
      cellW *= 1.08;
      cellH *= 1.08;
      cols = Math.max(1, Math.floor(width / cellW));
      rows = Math.max(1, Math.floor(height / cellH));
    }
    return { cols, rows, cellW, cellH, font, fontPx };
  }

  function backdropDataUrl(source, width, height) {
    const scale = Math.min(1, 1400 / Math.max(width, height));
    const w = Math.max(1, Math.round(width * scale));
    const h = Math.max(1, Math.round(height * scale));
    const thumb = document.createElement('canvas');
    thumb.width = w;
    thumb.height = h;
    drawCover(thumb.getContext('2d'), source, w, h);
    return thumb.toDataURL('image/jpeg', 0.82);
  }

  function renderSvg(image, state, outWidth, outHeight, unit) {
    const width = Math.max(1, Math.round(outWidth));
    const height = Math.max(1, Math.round(outHeight));
    const effect = state.effect || 'chars';
    const { cols, rows, cellW, cellH, fontPx } = computeGrid(width, height, state, unit);

    const title = `ASCII lab . hehe v02 — ${EFFECT_LABELS[effect] || effect} · ${cols}×${rows} cells`;
    const parts = [];
    parts.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img">`);
    parts.push(`<title>${escapeXml(title)}</title>`);
    if (state.backdrop === 'image' && image) {
      const blur = Math.max(0, Number(state.backdropBlur) || 0) * unit;
      if (blur > 0) {
        parts.push(`<defs><filter id="bgblur" x="-15%" y="-15%" width="130%" height="130%"><feGaussianBlur stdDeviation="${fixed(blur)}"/></filter></defs>`);
      }
      const filter = blur > 0 ? ' filter="url(#bgblur)"' : '';
      parts.push(`<image href="${backdropDataUrl(image, width, height)}" x="0" y="0" width="${width}" height="${height}" preserveAspectRatio="xMidYMid slice"${filter}/>`);
      parts.push(`<rect width="${width}" height="${height}" fill="${escapeXml(state.bg)}" opacity="0.25"/>`);
    } else if (!state.bgTransparent) {
      parts.push(`<rect width="${width}" height="${height}" fill="${escapeXml(state.bg)}"/>`);
    }

    if (image) {
      const tone = makeTone(state);
      const threshold = ((100 - state.coverage) / 100) * 0.85;
      const textGroup = effect === 'chars' || effect === 'braille';
      const paint = makeColorer(state);
      const opacity = clamp((state.charOpacity ?? 100) / 100, 0, 1);

      parts.push(`<g opacity="${fixed(opacity)}">`);
      if (textGroup) {
        if (effect === 'braille') {
          parts.push(`<g font-family="${escapeXml(BRAILLE_FONT)}" font-size="${fixed(fontPx)}" text-anchor="middle" dominant-baseline="central">`);
        } else {
          parts.push(`<defs><style>@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,${IBM_PLEX_MONO}) format('woff2');}</style></defs>`);
          parts.push(`<g font-family="${GLYPH_FONT.replace(/"/g, "'")}" font-size="${fixed(fontPx)}" text-anchor="middle" dominant-baseline="central">`);
        }
      }

      if (effect === 'braille') {
        const sw = cols * 2;
        const sh = rows * 4;
        const pixels = sample(image, sw, sh);
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            let mask = 0;
            let sr = 0, sg = 0, sb = 0, sum = 0, count = 0;
            for (let dy = 0; dy < 4; dy++) {
              for (let dx = 0; dx < 2; dx++) {
                const offset = ((row * 4 + dy) * sw + col * 2 + dx) * 4;
                if (pixels[offset + 3] < 8) continue;
                const r = pixels[offset];
                const g = pixels[offset + 1];
                const b = pixels[offset + 2];
                const luma = tone[(0.299 * r + 0.587 * g + 0.114 * b) | 0];
                sr += r;
                sg += g;
                sb += b;
                sum += luma;
                count++;
                const effLuma = state.invertMapping ? 1 - luma : luma;
                if (effLuma >= threshold) mask |= BRAILLE_BITS[dy][dx];
              }
            }
            if (!mask || !count) continue;
            const glyph = String.fromCharCode(0x2800 + mask);
            parts.push(`<text x="${fixed(col * cellW + cellW / 2)}" y="${fixed(row * cellH + cellH / 2)}" fill="${paint(sr / count, sg / count, sb / count, sum / count)}">${escapeXml(glyph)}</text>`);
          }
        }
      } else if (effect === 'dither') {
        ditherCells(image, state, tone, threshold, { cols, rows, cellW, cellH }, (x, y, w, h, color) => {
          parts.push(`<rect x="${fixed(x)}" y="${fixed(y)}" width="${fixed(w)}" height="${fixed(h)}" fill="${color}"/>`);
        });
      } else if (effect === 'halftone') {
        const pitch = Math.max(2, cellW);
        const dotsW = Math.max(1, Math.floor(width / pitch));
        const dotsH = Math.max(1, Math.floor(height / pitch));
        const pixels = sample(image, dotsW, dotsH);
        const maxR = pitch * 0.62;
        for (let y = 0; y < dotsH; y++) {
          for (let x = 0; x < dotsW; x++) {
            const offset = (y * dotsW + x) * 4;
            if (pixels[offset + 3] < 8) continue;
            const r = pixels[offset];
            const g = pixels[offset + 1];
            const b = pixels[offset + 2];
            const luma = tone[(0.299 * r + 0.587 * g + 0.114 * b) | 0];
            if (luma < threshold) continue;
            const radius = Math.max(0.35, luma * maxR);
            parts.push(`<circle cx="${fixed(x * pitch + pitch / 2)}" cy="${fixed(y * pitch + pitch / 2)}" r="${fixed(radius)}" fill="${paint(r, g, b, luma)}"/>`);
          }
        }
      } else if (effect === 'pixel') {
        const pixels = sampleNearest(image, cols, rows);
        const gap = 1;
        const invertColor = Boolean(state.invert) && state.palette === 'source';
        const palette = state.pixelPalette && state.pixelPalette !== 'original' ? DITHER_PALETTES[state.pixelPalette] : null;
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const offset = (row * cols + col) * 4;
            if (pixels[offset + 3] < 8) continue;
            const r = pixels[offset];
            const g = pixels[offset + 1];
            const b = pixels[offset + 2];
            const luma = tone[(0.299 * r + 0.587 * g + 0.114 * b) | 0];
            if (luma < threshold) continue;
            const [cr, cg, cb] = colorRgb(
              state,
              invertColor ? 255 - r : r,
              invertColor ? 255 - g : g,
              invertColor ? 255 - b : b,
              luma,
            );
            const thresholdAt = ditherThreshold(col, row);
            const [qr, qg, qb] = palette
              ? paletteColor(palette, cr, cg, cb, thresholdAt)
              : [quantizeChannel(cr), quantizeChannel(cg), quantizeChannel(cb)];
            parts.push(`<rect x="${fixed(col * cellW + gap / 2)}" y="${fixed(row * cellH + gap / 2)}" width="${fixed(Math.max(0.5, cellW - gap))}" height="${fixed(Math.max(0.5, cellH - gap))}" fill="rgb(${qr},${qg},${qb})"/>`);
          }
        }
      } else if (effect === 'block') {
        const pixels = sample(image, cols, rows);
        const gap = Math.min(2, cellW * 0.08);
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const offset = (row * cols + col) * 4;
            if (pixels[offset + 3] < 8) continue;
            const r = pixels[offset];
            const g = pixels[offset + 1];
            const b = pixels[offset + 2];
            const luma = tone[(0.299 * r + 0.587 * g + 0.114 * b) | 0];
            if (luma < threshold) continue;
            parts.push(`<rect x="${fixed(col * cellW + gap / 2)}" y="${fixed(row * cellH + gap / 2)}" width="${fixed(cellW - gap)}" height="${fixed(cellH - gap)}" fill="${paint(r, g, b, luma)}"/>`);
          }
        }
      } else {
        const pixels = sample(image, cols, rows);
        const chars = Array.from(state.chars || ' ');
        const last = chars.length - 1;
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const offset = (row * cols + col) * 4;
            if (pixels[offset + 3] < 8) continue;
            const r = pixels[offset];
            const g = pixels[offset + 1];
            const b = pixels[offset + 2];
            const luma = tone[(0.299 * r + 0.587 * g + 0.114 * b) | 0];
            if (luma < threshold) continue;
            const glyph = glyphAt(state, chars, last, luma, col, row);
            if (glyph === ' ') continue;
            parts.push(`<text x="${fixed(col * cellW + cellW / 2)}" y="${fixed(row * cellH + cellH / 2)}" fill="${paint(r, g, b, luma)}">${escapeXml(glyph)}</text>`);
          }
        }
      }

      if (textGroup) parts.push('</g>');
      parts.push('</g>');

      if (state.dotGrid) {
        const dotColor = state.palette === 'tint' ? state.tintColor : '#ffffff';
        const r = Math.max(0.6, Math.min(cellW, cellH) * 0.08);
        parts.push(`<g fill="${escapeXml(dotColor)}" opacity="0.22">`);
        for (let row = 0; row < rows; row++) {
          const y = fixed((row + 0.5) * cellH);
          for (let col = 0; col < cols; col++) {
            const x = fixed((col + 0.5) * cellW);
            parts.push(`<circle cx="${x}" cy="${y}" r="${fixed(r)}"/>`);
          }
        }
        parts.push('</g>');
      }
    }

    parts.push('</svg>');
    return { svg: parts.join('\n'), cols, rows };
  }

  /* ---------- viewport ---------- */

  const canvas = document.getElementById('canvas');
  const stage = document.getElementById('stage');
  const viewport = document.getElementById('viewport');

  const tintValue = document.getElementById('tintValue');

  const state = { ...DEFAULT_STATE };
  let presetBase = { ...DEFAULT_STATE };
  let previewLook = null;

  /* ---------- color grade ---------- */

  const COLOR_DEFAULT = Object.freeze({
    filter: 'none',
    sat: 100,
    vibrance: 0,
    hue: 0,
    grayscale: 0,
    tintOpacity: 0,
    blend: 'multiply',
    gradient: 'none',
  });

  const COLOR_FILTERS = {
    none: { sat: 100, vibrance: 0, hue: 0, grayscale: 0, tintOpacity: 0, blend: 'multiply', gradient: 'none' },
    bw: { sat: 100, vibrance: 0, hue: 0, grayscale: 100, tintOpacity: 0, blend: 'multiply', gradient: 'none' },
    sepia: { sat: 100, vibrance: 0, hue: 0, grayscale: 100, tint: '#c9a26d', tintOpacity: 55, blend: 'color', gradient: 'none' },
    warm: { sat: 105, vibrance: 0, hue: 0, grayscale: 0, tint: '#ff9a4d', tintOpacity: 30, blend: 'soft-light', gradient: 'none' },
    cool: { sat: 100, vibrance: 0, hue: 0, grayscale: 0, tint: '#5aa9ff', tintOpacity: 30, blend: 'soft-light', gradient: 'none' },
    vintage: { sat: 80, vibrance: 0, hue: -8, grayscale: 10, tint: '#dcb98f', tintOpacity: 32, blend: 'color', gradient: 'none' },
    fade: { sat: 76, vibrance: 0, hue: 0, grayscale: 6, tint: '#dbe4ee', tintOpacity: 26, blend: 'screen', gradient: 'none' },
    cyber: { sat: 140, vibrance: 25, hue: 35, grayscale: 0, tint: '#7b5cff', tintOpacity: 30, blend: 'color', gradient: 'none' },
  };

  const GRADIENT_MAPS = {
    mono: [[0, 0, 0], [255, 255, 255]],
    sepia: [[26, 16, 8], [244, 227, 200]],
    ember: [[16, 4, 0], [255, 207, 107]],
    mint: [[3, 20, 16], [198, 255, 214]],
    violet: [[18, 0, 46], [0, 229, 255]],
  };

  const color = { ...COLOR_DEFAULT };
  const colorCanvas = document.createElement('canvas');
  const colorCtx = colorCanvas.getContext('2d', { willReadFrequently: true });
  let colorSource = null;
  let colorFrame = 0;

  function hasColorTone() {
    return color.sat !== 100 || color.hue !== 0 || color.grayscale !== 0 ||
      color.vibrance !== 0 || color.tintOpacity !== 0 || color.gradient !== 'none';
  }

  function applyColorSource() {
    if (!colorSource) {
      image = null;
      return;
    }
    if (!hasColorTone()) {
      image = colorSource;
      return;
    }

    try {
      const { w, h } = sourceSize(colorSource);
      const scale = Math.min(1, 1600 / Math.max(w, h));
      const cw = Math.max(1, Math.round(w * scale));
      const ch = Math.max(1, Math.round(h * scale));
      if (colorCanvas.width !== cw) colorCanvas.width = cw;
      if (colorCanvas.height !== ch) colorCanvas.height = ch;

      const ctx = colorCtx;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.clearRect(0, 0, cw, ch);

      const filters = [];
      if (color.sat !== 100) filters.push(`saturate(${color.sat}%)`);
      if (color.hue !== 0) filters.push(`hue-rotate(${color.hue}deg)`);
      if (color.grayscale !== 0) filters.push(`grayscale(${color.grayscale}%)`);
      ctx.filter = filters.length ? filters.join(' ') : 'none';
      ctx.drawImage(colorSource, 0, 0, w, h, 0, 0, cw, ch);
      ctx.filter = 'none';

      const gradient = GRADIENT_MAPS[color.gradient] || null;
      if (color.vibrance !== 0 || gradient) {
        const frame = ctx.getImageData(0, 0, cw, ch);
        const px = frame.data;
        const vib = color.vibrance / 100;
        for (let i = 0; i < px.length; i += 4) {
          let r = px[i];
          let g = px[i + 1];
          let b = px[i + 2];
          if (vib > 0) {
            const l = 0.299 * r + 0.587 * g + 0.114 * b;
            const hi = Math.max(r, g, b);
            const lo = Math.min(r, g, b);
            const sat = hi ? (hi - lo) / hi : 0;
            const boost = 1 + vib * (1 - sat);
            r = l + (r - l) * boost;
            g = l + (g - l) * boost;
            b = l + (b - l) * boost;
          }
          if (gradient) {
            const t = clamp((0.299 * r + 0.587 * g + 0.114 * b) / 255, 0, 1);
            r = gradient[0][0] + (gradient[1][0] - gradient[0][0]) * t;
            g = gradient[0][1] + (gradient[1][1] - gradient[0][1]) * t;
            b = gradient[0][2] + (gradient[1][2] - gradient[0][2]) * t;
          }
          px[i] = r;
          px[i + 1] = g;
          px[i + 2] = b;
        }
        ctx.putImageData(frame, 0, 0);
      }

      if (color.tintOpacity > 0) {
        ctx.globalCompositeOperation = color.blend === 'normal' ? 'source-over' : color.blend;
        ctx.globalAlpha = color.tintOpacity / 100;
        ctx.fillStyle = state.tintColor;
        ctx.fillRect(0, 0, cw, ch);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
      }

      image = colorCanvas;
    } catch (error) {
      // A tainted local image cannot be graded; keep the original source.
      image = colorSource;
    }
  }

  function scheduleColor() {
    if (colorFrame) return;
    colorFrame = requestAnimationFrame(() => {
      colorFrame = 0;
      applyColorSource();
      requestRender();
    });
  }

  function contentBox() {
    const rect = viewport.getBoundingClientRect();
    const cs = getComputedStyle(viewport);
    const pl = parseFloat(cs.paddingLeft) || 0;
    const pr = parseFloat(cs.paddingRight) || 0;
    const pt = parseFloat(cs.paddingTop) || 0;
    const pb = parseFloat(cs.paddingBottom) || 0;
    const w = Math.max(80, rect.width - pl - pr);
    const h = Math.max(80, rect.height - pt - pb);
    return {
      x: rect.left + pl,
      y: rect.top + pt,
      w,
      h,
      cx: rect.left + pl + w / 2,
      cy: rect.top + pt + h / 2,
    };
  }

  function fitCanvas() {
    if (!image) return;
    const { w: srcW, h: srcH } = sourceSize(image);
    const box = contentBox();
    const scale = Math.min((box.w - 16) / srcW, (box.h - 16) / srcH);
    baseW = Math.max(24, Math.round(srcW * scale));
    baseH = Math.max(24, Math.round(srcH * scale));
    canvas.style.width = `${baseW}px`;
    canvas.style.height = `${baseH}px`;
  }

  function applyView() {
    canvas.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
  }

  function resetView() {
    view.x = 0;
    view.y = 0;
    view.z = 1;
    applyView();
  }

  function zoomAt(clientX, clientY, next) {
    const z = clamp(next, ZOOM_MIN, ZOOM_MAX);
    if (!image) return;
    const box = contentBox();
    const px = clientX - box.cx;
    const py = clientY - box.cy;
    view.x = px - (px - view.x) * (z / view.z);
    view.y = py - (py - view.y) * (z / view.z);
    view.z = z;
    applyView();
  }

  function zoomAtCenter(factor) {
    const box = contentBox();
    zoomAt(box.cx, box.cy, view.z * factor);
  }

  function dpr() {
    return Math.min(2, window.devicePixelRatio || 1);
  }

  /* ---------- scheduler ---------- */

  function requestRender() {
    if (dirty) return;
    dirty = true;
    requestAnimationFrame(() => {
      dirty = false;
      renderPreview();
    });
  }

  function applyCanvasLook() {
    const transparent = Boolean(state.bgTransparent && state.backdrop !== 'image');
    canvas.classList.toggle('is-transparent', transparent);
    canvas.style.background = transparent ? '' : state.bg;
  }

  function paintIdle() {
    canvas.hidden = true;
    canvas.classList.remove('is-transparent');
    canvas.style.background = '';
    canvas.setAttribute('aria-label', 'ASCII preview. Open an image or try the demo.');
  }

  function renderPreview() {
    if (!image) {
      paintIdle();
      return;
    }
    applyCanvasLook();
    const scale = dpr();
    try {
      const result = renderAscii(
        canvas,
        image,
        state,
        Math.round(baseW * scale),
        Math.round(baseH * scale),
        scale,
      );
      canvas.setAttribute(
        'aria-label',
        `ASCII preview, ${EFFECT_LABELS[state.effect] || state.effect} effect, ${result.cols} by ${result.rows} cells`,
      );
    } catch (error) {
      showToast('Could not read this image. If it was opened locally, serve the page over http://', 'error');
    }
  }

  /* ---------- images ---------- */

  function setImage(source, url = '') {
    const previousSource = colorSource;
    if (imageUrl) URL.revokeObjectURL(imageUrl);
    imageUrl = url;
    colorSource = source;
    image = source;
    applyColorSource();
    empty.hidden = true;
    canvas.hidden = false;
    resetView();
    fitCanvas();
    requestRender();
    if (previousSource && previousSource !== source && typeof previousSource.close === 'function') {
      previousSource.close();
    }
  }

  async function loadImage(file) {
    if (!file) return;
    if (!file.type || !file.type.startsWith('image/')) {
      showToast('That file is not an image', 'error');
      return;
    }

    const token = ++imageLoadToken;

    try {
      if (typeof createImageBitmap === 'function') {
        const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
        if (token !== imageLoadToken) {
          if (typeof bitmap.close === 'function') bitmap.close();
          return;
        }
        setImage(bitmap);
        showToast('Image loaded');
        return;
      }
    } catch (error) {
      // Fall through to the <img> path (older Safari, file:// quirks).
    }

    const url = URL.createObjectURL(file);
    const img = new Image();
    img.decoding = 'async';
    img.onload = () => {
      if (token !== imageLoadToken) {
        URL.revokeObjectURL(url);
        return;
      }
      setImage(img, url);
      showToast('Image loaded');
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      if (token === imageLoadToken) showToast('Could not load that image', 'error');
    };
    img.src = url;
  }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
