  let demoImage = null;

  async function makeDemoImage() {
    if (!demoImage) {
      demoImage = new Image();
      demoImage.src = DEMO_SRC;
      await demoImage.decode();
    }
    return demoImage;
  }

  function showToast(message, kind = 'ok') {
    toast.textContent = message;
    toast.dataset.kind = kind;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.hidden = true;
    }, kind === 'error' ? 6000 : 2500);
  }

  /* ---------- controls ---------- */

  function buildLooks() {
    const ids = Object.keys(PRESETS);
    moreLookIds = ids.slice(7);

    const makeLook = (id, row) => {
      const preset = PRESETS[id];
      const button = document.createElement('button');
      button.type = 'button';
      button.dataset.preset = id;
      button.setAttribute('aria-pressed', 'false');
      if (row) {
        const swatch = document.createElement('span');
        swatch.className = 'look-swatch';
        swatch.setAttribute('aria-hidden', 'true');
        swatch.style.setProperty('--look-bg', preset.bg);
        swatch.style.setProperty('--look-fg', preset.tintColor);
        swatch.textContent = LOOK_GLYPHS[id] || '?';
        const label = document.createElement('span');
        label.textContent = preset.label;
        button.append(swatch, label);
      } else {
        button.className = 'look-btn';
        button.setAttribute('aria-label', preset.label);
        button.title = preset.label;
        button.style.setProperty('--look-bg', preset.bg);
        button.style.setProperty('--look-fg', preset.tintColor);
        button.textContent = LOOK_GLYPHS[id] || '?';
      }
      return button;
    };

    for (const id of ids.slice(0, 7)) lookGrid.appendChild(makeLook(id, false));

    lookMoreBtn = document.createElement('button');
    lookMoreBtn.type = 'button';
    lookMoreBtn.className = 'look-more';
    lookMoreBtn.id = 'lookMoreBtn';
    lookMoreBtn.setAttribute('aria-label', 'More looks');
    lookMoreBtn.title = 'More looks';
    lookMoreBtn.setAttribute('aria-expanded', 'false');
    lookMoreBtn.innerHTML = '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
    lookGrid.appendChild(lookMoreBtn);

    for (const id of moreLookIds) lookMore.appendChild(makeLook(id, true));
  }

  function setMore(open) {
    moreOpen = open;
    lookMore.hidden = !open;
    if (lookMoreBtn) lookMoreBtn.setAttribute('aria-expanded', String(open));
  }

  function markCustom() {
    state.preset = 'custom';
    syncLook();
    syncIndicators();
  }

  function syncIndicators() {
    const graded = Object.keys(COLOR_DEFAULT).some((key) => color[key] !== COLOR_DEFAULT[key]);
    const edited = graded || !presetBase || JSON.stringify(presetBase) !== JSON.stringify(state);
    resetBtn.hidden = !edited;
  }

  function syncLook() {
    for (const button of panel.querySelectorAll('[data-preset]')) {
      button.setAttribute('aria-pressed', String(button.dataset.preset === state.preset));
    }
    if (lookMoreBtn) lookMoreBtn.classList.toggle('has-active', moreLookIds.includes(state.preset));
    const preset = state.preset !== 'custom' ? PRESETS[state.preset] : null;
    lookName.textContent = previewLook || (preset ? preset.label : 'Custom');
  }

  function setPreviewLook(id) {
    const preset = PRESETS[id];
    previewLook = preset ? preset.label : null;
    syncLook();
  }

  function clearPreviewLook() {
    if (!previewLook) return;
    previewLook = null;
    syncLook();
  }

  function backgroundMode() {
    if (state.backdrop === 'image') return 'blurred';
    return state.bgTransparent ? 'transparent' : 'solid';
  }

  function setBackgroundMode(mode) {
    if (mode === 'blurred') {
      state.backdrop = 'image';
      state.bgTransparent = false;
    } else {
      state.backdrop = 'solid';
      state.bgTransparent = mode === 'transparent';
    }
    markCustom();
    syncControls();
    requestRender();
  }

  function applyPreset(id) {
    const preset = PRESETS[id];
    if (!preset) return;
    const backdrop = state.backdrop;
    const backdropBlur = state.backdropBlur;
    Object.assign(state, DEFAULT_STATE, preset);
    state.chars = rampById(state.ramp).chars;
    state.backdrop = backdrop;
    state.backdropBlur = backdropBlur;
    state.preset = id;
    previewLook = null;
    presetBase = { ...state };
    setMore(false);
    syncControls();
    applyColorSource();
    requestRender();
    showToast(`Look: ${preset.label}`);
  }

  function updateFill(input) {
    const min = Number(input.min);
    const max = Number(input.max);
    const raw = max > min ? ((Number(input.value) - min) / (max - min)) * 100 : 0;
    input.style.setProperty('--fill', `${clamp(raw, 0, 100)}%`);
  }

  function setPanelTab(name) {
    for (const tab of panelTabs) {
      const active = tab.dataset.tab === name;
      tab.setAttribute('aria-selected', String(active));
      tab.tabIndex = active ? 0 : -1;
      for (const id of (tab.getAttribute('aria-controls') || '').split(/\s+/)) {
        const section = id ? document.getElementById(id) : null;
        if (section) section.hidden = !active;
      }
    }
    panelBody.scrollTop = 0;
  }

  function syncColorControls() {
    tintColor.value = state.tintColor;
    tintValue.textContent = state.tintColor;
    gradeBlend.value = color.blend;
    gradeGradient.value = color.gradient;
    for (const input of panel.querySelectorAll('input[data-color-key]')) {
      if (input.type === 'number' && document.activeElement === input) continue;
      input.value = color[input.dataset.colorKey];
      if (input.type === 'range') updateFill(input);
    }
    let activeFilter = null;
    for (const chip of panel.querySelectorAll('[data-color-filter]')) {
      const pressed = color.filter === chip.dataset.colorFilter;
      chip.setAttribute('aria-pressed', String(pressed));
      if (pressed) activeFilter = chip;
    }
    gradeLookName.textContent = activeFilter ? activeFilter.textContent : 'Custom';
    for (const sw of panel.querySelectorAll('[role="switch"][data-flag]')) {
      sw.setAttribute('aria-checked', String(Boolean(state[sw.dataset.flag])));
    }
  }

  function applyColorFilter(id) {
    const filter = COLOR_FILTERS[id];
    if (!filter) return;
    const { tint, ...preset } = filter;
    Object.assign(color, preset, { filter: id });
    if (tint) state.tintColor = tint;
    markCustom();
    syncControls();
    scheduleColor();
  }

  function updateColorRange(input) {
    const key = input.dataset.colorKey;
    color[key] = Number(input.value);
    color.filter = 'custom';
    markCustom();
    const number = panel.querySelector(`input[type="number"][data-color-key="${key}"]`);
    if (number) number.value = input.value;
    syncColorControls();
    scheduleColor();
  }

  function updateColorNumber(input, commit) {
    const key = input.dataset.colorKey;
    const min = Number(input.min);
    const max = Number(input.max);
    const raw = input.value.trim() === '' ? NaN : Number(input.value);

    if (!Number.isFinite(raw)) {
      if (commit) input.value = String(color[key]);
      return;
    }
    if (!commit && (raw < min || raw > max)) return;

    const value = clamp(Math.round(raw), min, max);
    if (commit) input.value = String(value);
    color[key] = value;
    color.filter = 'custom';
    markCustom();
    const range = panel.querySelector(`input[type="range"][data-color-key="${key}"]`);
    if (range) {
      range.value = String(value);
      updateFill(range);
    }
    syncColorControls();
    scheduleColor();
  }

  function syncControls() {
    applyCanvasLook();

    effectSelect.value = state.effect;
    rampSelect.value = state.ramp;
    ditherAlgoSelect.value = state.ditherAlgorithm;
    ditherPaletteSelect.value = state.ditherPalette;
    pixelPaletteSelect.value = state.pixelPalette;
    bgColor.value = state.bg;
    bgValue.textContent = state.bg;
    if (document.activeElement !== charsInput) charsInput.value = state.chars;

    charsControls.hidden = state.effect !== 'chars';
    ditherControls.hidden = state.effect !== 'dither';
    ditherColorRow.hidden = state.effect !== 'dither';
    pixelColorRow.hidden = state.effect !== 'pixel';
    charsRow.hidden = state.ramp !== 'custom';
    randomRows.hidden = !state.randomize;
    const mode = backgroundMode();
    bgColorRow.hidden = mode !== 'solid';
    gaussianRows.hidden = mode !== 'blurred';

    sizeLabel.textContent = state.effect === 'chars'
      ? 'Size'
      : state.effect === 'block'
        ? 'Tile size'
        : state.effect === 'pixel'
          ? 'Pixel size'
          : 'Dot size';

    for (const button of panel.querySelectorAll('[data-palette]')) {
      button.setAttribute('aria-pressed', String(button.dataset.palette === state.palette));
    }
    for (const button of panel.querySelectorAll('[data-bgmode]')) {
      button.setAttribute('aria-pressed', String(button.dataset.bgmode === mode));
    }
    for (const button of panel.querySelectorAll('.chip[data-flag]')) {
      button.setAttribute('aria-pressed', String(Boolean(state[button.dataset.flag])));
    }

    for (const input of panel.querySelectorAll('input[data-key]')) {
      if (input.type === 'number' && document.activeElement === input) continue;
      input.value = state[input.dataset.key];
      if (input.type === 'range') updateFill(input);
    }

    gripText.textContent = `Controls · ${EFFECT_NAMES[state.effect] || 'Chars'}`;
    syncLook();
    syncColorControls();
    syncIndicators();
  }

  function updateRange(input) {
    const key = input.dataset.key;
    if (!key) return;
    state[key] = Number(input.value);
    markCustom();
    const number = panel.querySelector(`input[type="number"][data-key="${key}"]`);
    if (number) number.value = input.value;
    updateFill(input);
    requestRender();
  }

  function updateNumber(input, commit) {
    const key = input.dataset.key;
    if (!key) return;
    const min = Number(input.min);
    const max = Number(input.max);
    const raw = input.value.trim() === '' ? NaN : Number(input.value);

    if (!Number.isFinite(raw)) {
      if (commit) input.value = String(state[key]);
      return;
    }
    if (!commit && (raw < min || raw > max)) return;

    const value = clamp(Math.round(raw), min, max);
    if (commit) input.value = String(value);
    state[key] = value;
    markCustom();
    const range = panel.querySelector(`input[type="range"][data-key="${key}"]`);
    if (range) {
      range.value = String(value);
      updateFill(range);
    }
    requestRender();
  }

  function resetSettings() {
    Object.assign(state, DEFAULT_STATE);
    Object.assign(color, COLOR_DEFAULT);
    state.chars = rampById(state.ramp).chars;
    presetBase = { ...state };
    previewLook = null;
    setMore(false);
    applyColorSource();
    syncControls();
    if (image) {
      resetView();
      fitCanvas();
    }
    requestRender();
    showToast('Settings reset');
  }

  /* ---------- exports ---------- */

  function renderExport(scale, opaque = false) {
    const { w: srcW, h: srcH } = sourceSize(image);
    let multiplier = scale;

    const longest = Math.max(srcW, srcH) * multiplier;
    if (longest > MAX_EXPORT_SIDE) multiplier *= MAX_EXPORT_SIDE / longest;
    if (srcW * srcH * multiplier * multiplier > MAX_EXPORT_AREA) {
      multiplier = Math.sqrt(MAX_EXPORT_AREA / (srcW * srcH));
    }

    const outW = Math.max(1, Math.round(srcW * multiplier));
    const outH = Math.max(1, Math.round(srcH * multiplier));
    const unit = outW / baseW;

    const renderState = opaque && state.bgTransparent ? { ...state, bgTransparent: false } : state;
    const target = document.createElement('canvas');
    const result = renderAscii(target, image, renderState, outW, outH, unit);
    return { canvas: target, cols: result.cols, rows: result.rows };
  }

  function exportName(ext, cols, rows) {
    return `ascii-lab-${dateStamp()}-${state.effect}-${cols}x${rows}.${ext}`;
  }

  async function exportRaster(scale, type, quality, ext, opaque = false) {
    if (!image || !baseW) {
      showToast('Open an image first', 'error');
      return;
    }
    try {
      const output = renderExport(scale, opaque);
      const name = exportName(ext, output.cols, output.rows);
      let blob = null;
      try {
        blob = await new Promise((resolve) => output.canvas.toBlob(resolve, type, quality));
      } catch (error) {
        blob = null;
      }

      if (blob) {
        downloadBlob(blob, name);
      } else {
        downloadUrl(output.canvas.toDataURL(type, quality), name);
      }
      showToast(`${ext.toUpperCase()} saved`);
    } catch (error) {
      showToast('Export failed. If you opened this file locally, serve it over http://', 'error');
    }
  }

  function exportSvg() {
    if (!image || !baseW) {
      showToast('Open an image first', 'error');
      return;
    }
    try {
      const result = renderSvg(image, state, baseW, baseH, 1);
      const name = exportName('svg', result.cols, result.rows);
      downloadBlob(new Blob([result.svg], { type: 'image/svg+xml' }), name);
      showToast('SVG saved');
    } catch (error) {
      showToast('SVG export failed', 'error');
    }
  }

  function buildAsciiText() {
    const width = Math.max(1, Math.round(baseW));
    const height = Math.max(1, Math.round(baseH));
    const effect = state.effect || 'chars';
    const { cols, rows, cellW, cellH } = computeGrid(width, height, state, 1);

    const tone = makeTone(state);
    const threshold = ((100 - state.coverage) / 100) * 0.85;
    const lines = [];
    const lumaAt = (pixels, offset) => tone[(0.299 * pixels[offset] + 0.587 * pixels[offset + 1] + 0.114 * pixels[offset + 2]) | 0];

    if (effect === 'braille') {
      const sw = cols * 2;
      const sh = rows * 4;
      const pixels = sample(image, sw, sh);
      for (let row = 0; row < rows; row++) {
        let line = '';
        for (let col = 0; col < cols; col++) {
          let mask = 0;
          for (let dy = 0; dy < 4; dy++) {
            for (let dx = 0; dx < 2; dx++) {
              const offset = ((row * 4 + dy) * sw + col * 2 + dx) * 4;
              if (pixels[offset + 3] < 8) continue;
              const luma = lumaAt(pixels, offset);
              const effLuma = state.invertMapping ? 1 - luma : luma;
              if (effLuma >= threshold) mask |= BRAILLE_BITS[dy][dx];
            }
          }
          line += mask ? String.fromCharCode(0x2800 + mask) : ' ';
        }
        lines.push(line.trimEnd());
      }
    } else if (effect === 'dither') {
      const sw = cols * 2;
      const sh = rows * 2;
      const mask = new Uint8Array(sw * sh);
      ditherCells(image, state, tone, threshold, { cols, rows, cellW, cellH }, null, mask);
      for (let y = 0; y < sh; y++) {
        let line = '';
        for (let x = 0; x < sw; x++) line += mask[y * sw + x] ? '█' : ' ';
        lines.push(line.trimEnd());
      }
    } else if (effect === 'halftone') {
      const pitch = Math.max(2, cellW);
      const dotsW = Math.max(1, Math.floor(width / pitch));
      const dotsH = Math.max(1, Math.floor(height / pitch));
      const pixels = sample(image, dotsW, dotsH);
      for (let y = 0; y < dotsH; y++) {
        let line = '';
        for (let x = 0; x < dotsW; x++) {
          const offset = (y * dotsW + x) * 4;
          line += pixels[offset + 3] >= 8 && lumaAt(pixels, offset) >= threshold ? '█' : ' ';
        }
        lines.push(line.trimEnd());
      }
    } else if (effect === 'block' || effect === 'pixel') {
      const pixels = effect === 'pixel' ? sampleNearest(image, cols, rows) : sample(image, cols, rows);
      for (let row = 0; row < rows; row++) {
        let line = '';
        for (let col = 0; col < cols; col++) {
          const offset = (row * cols + col) * 4;
          let mark = ' ';
          if (pixels[offset + 3] >= 8 && lumaAt(pixels, offset) >= threshold) mark = '█';
          line += mark;
        }
        lines.push(line.trimEnd());
      }
    } else {
      const pixels = sample(image, cols, rows);
      const chars = Array.from(state.chars || ' ');
      const last = chars.length - 1;
      for (let row = 0; row < rows; row++) {
        let line = '';
        for (let col = 0; col < cols; col++) {
          const offset = (row * cols + col) * 4;
          let glyph = ' ';
          if (pixels[offset + 3] >= 8) {
            const luma = lumaAt(pixels, offset);
            if (luma >= threshold) glyph = glyphAt(state, chars, last, luma, col, row);
          }
          line += glyph;
        }
        lines.push(line.trimEnd());
      }
    }

    while (lines.length && lines[lines.length - 1] === '') lines.pop();
    return { text: lines.join('\n'), cols, rows };
  }

  function exportTxt() {
    if (!image || !baseW) {
      showToast('Open an image first', 'error');
      return;
    }
    const result = buildAsciiText();
    const name = exportName('txt', result.cols, result.rows);
    downloadBlob(new Blob([result.text], { type: 'text/plain;charset=utf-8' }), name);
    showToast('TXT saved');
  }

  function fallbackCopy(text) {
    const area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    const copied = document.execCommand('copy');
    area.remove();
    if (!copied) throw new Error('copy failed');
  }

  async function copyAscii() {
    if (!image || !baseW) {
      showToast('Open an image first', 'error');
      return;
    }
    const { text } = buildAsciiText();
    try {
      await navigator.clipboard.writeText(text);
    } catch (error) {
      try {
        fallbackCopy(text);
      } catch (fallbackError) {
        showToast('Could not copy to clipboard', 'error');
        return;
      }
    }
    showToast('ASCII copied');
  }

  /* ---------- interaction ---------- */

  function bindControls() {
    panel.addEventListener('input', (event) => {
      const target = event.target;
      if (!(target instanceof HTMLInputElement)) return;
      if (target.type === 'range' && target.dataset.colorKey) {
        updateColorRange(target);
      } else if (target.type === 'number' && target.dataset.colorKey) {
        updateColorNumber(target, false);
      } else if (target.type === 'range' && target.dataset.key) {
        updateRange(target);
      } else if (target.type === 'number' && target.dataset.key) {
        updateNumber(target, false);
      } else if (target === charsInput) {
        state.chars = target.value || ' ';
        state.ramp = 'custom';
        rampSelect.value = 'custom';
        charsRow.hidden = false;
        markCustom();
        requestRender();
      }
    });

    panel.addEventListener('change', (event) => {
      const target = event.target;
      if (!(target instanceof HTMLInputElement || target instanceof HTMLSelectElement)) return;

      if (target instanceof HTMLInputElement && target.type === 'number' && target.dataset.colorKey) {
        updateColorNumber(target, true);
        return;
      }

      if (target instanceof HTMLInputElement && target.type === 'number' && target.dataset.key) {
        updateNumber(target, true);
        return;
      }

      if (target === gradeBlend || target === gradeGradient) {
        if (target === gradeBlend) color.blend = target.value;
        else color.gradient = target.value;
        color.filter = 'custom';
        markCustom();
        syncColorControls();
        scheduleColor();
      } else if (target === effectSelect) {
        state.effect = target.value;
        markCustom();
        syncControls();
        requestRender();
      } else if (target === rampSelect) {
        const previousRamp = state.ramp;
        state.ramp = target.value;
        if (state.ramp === 'custom') {
          if (previousRamp !== 'custom') state.chars = rampById(previousRamp).chars;
        } else {
          state.chars = rampById(state.ramp).chars;
        }
        markCustom();
        syncControls();
        requestRender();
      } else if (target === ditherAlgoSelect) {
        state.ditherAlgorithm = target.value;
        markCustom();
        requestRender();
      } else if (target === ditherPaletteSelect) {
        state.ditherPalette = target.value;
        markCustom();
        requestRender();
      } else if (target === pixelPaletteSelect) {
        state.pixelPalette = target.value;
        markCustom();
        requestRender();
      } else if (target instanceof HTMLInputElement && target.type === 'color') {
        const key = target.dataset.color;
        if (key) {
          state[key] = target.value;
          markCustom();
          syncControls();
          if (key === 'tintColor') scheduleColor();
          else requestRender();
        }
      }
    });

    panel.addEventListener('click', (event) => {
      const target = event.target;
      if (!(target instanceof Element)) return;

      if (target.closest('#lookMoreBtn')) {
        setMore(!moreOpen);
        return;
      }
      if (target.closest('#advancedToggle')) {
        const open = advancedToggle.getAttribute('aria-expanded') !== 'true';
        advancedToggle.setAttribute('aria-expanded', String(open));
        advancedBody.hidden = !open;
        return;
      }
      if (target.closest('#resetBtn')) {
        resetSettings();
        return;
      }

      const lookButton = target.closest('[data-preset]');
      if (lookButton) {
        applyPreset(lookButton.dataset.preset);
        return;
      }

      const filterChip = target.closest('[data-color-filter]');
      if (filterChip) {
        applyColorFilter(filterChip.dataset.colorFilter);
        return;
      }

      const paletteButton = target.closest('[data-palette]');
      if (paletteButton) {
        state.palette = paletteButton.dataset.palette;
        markCustom();
        syncControls();
        requestRender();
        return;
      }

      const bgButton = target.closest('[data-bgmode]');
      if (bgButton) {
        setBackgroundMode(bgButton.dataset.bgmode);
        return;
      }

      const flagButton = target.closest('button[data-flag]');
      if (flagButton) {
        const key = flagButton.dataset.flag;
        state[key] = !state[key];
        markCustom();
        syncControls();
        requestRender();
      }
    });

    panel.addEventListener('mouseover', (event) => {
      const target = event.target;
      if (!(target instanceof Element)) return;
      const button = target.closest('[data-preset]');
      if (button) setPreviewLook(button.dataset.preset);
    });

    panel.addEventListener('mouseout', (event) => {
      const target = event.target;
      if (!(target instanceof Element)) return;
      const button = target.closest('[data-preset]');
      if (button && !button.contains(event.relatedTarget)) clearPreviewLook();
    });

    panel.addEventListener('focusin', (event) => {
      const target = event.target;
      if (!(target instanceof Element)) return;
      const button = target.closest('[data-preset]');
      if (button) setPreviewLook(button.dataset.preset);
    });

    panel.addEventListener('focusout', (event) => {
      const target = event.target;
      if (!(target instanceof Element)) return;
      const button = target.closest('[data-preset]');
      if (button && !button.contains(event.relatedTarget)) clearPreviewLook();
    });

    panel.addEventListener('dblclick', (event) => {
      const target = event.target;
      if (!(target instanceof Element)) return;
      const label = target.closest('label[for]');
      if (!label) return;
      const input = document.getElementById(label.getAttribute('for'));
      if (!(input instanceof HTMLInputElement) || input.type !== 'range' || input.disabled) return;
      const colorKey = input.dataset.colorKey;
      const key = input.dataset.key;
      if (!colorKey && !key) return;
      const fallback = colorKey ? COLOR_DEFAULT[colorKey] : DEFAULT_STATE[key];
      if (typeof fallback !== 'number') return;
      event.preventDefault();
      input.value = String(fallback);
      if (colorKey) {
        color[colorKey] = fallback;
        color.filter = 'custom';
        updateColorRange(input);
      } else {
        updateRange(input);
      }
    });

    for (const tab of panelTabs) {
      tab.addEventListener('click', () => setPanelTab(tab.dataset.tab));
      tab.addEventListener('keydown', (event) => {
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        const index = panelTabs.indexOf(tab);
        const next = event.key === 'Home' ? 0
          : event.key === 'End' ? panelTabs.length - 1
            : (index + (event.key === 'ArrowRight' ? 1 : -1) + panelTabs.length) % panelTabs.length;
        setPanelTab(panelTabs[next].dataset.tab);
        panelTabs[next].focus();
      });
    }

    panelGrip.addEventListener('click', () => {
      const collapsed = panel.classList.toggle('is-collapsed');
      panelGrip.setAttribute('aria-expanded', String(!collapsed));
    });
  }

  function bindActions() {
    document.addEventListener('click', (event) => {
      const target = event.target;
      if (!(target instanceof Element)) return;

      if (moreOpen && !target.closest('#lookSection')) setMore(false);

      const actionEl = target.closest('[data-action]');
      if (actionEl) {
        const action = actionEl.dataset.action;
        if (action === 'open') {
          fileInput.click();
        } else if (action === 'demo') {
          makeDemoImage()
            .then((demo) => {
              setImage(demo);
              showToast('Demo loaded');
            })
            .catch(() => showToast('Could not load the demo', 'error'));
        } else if (action === 'png1') {
          exportMenu.open = false;
          exportRaster(1, 'image/png', undefined, 'png');
        } else if (action === 'png2') {
          exportMenu.open = false;
          exportRaster(2, 'image/png', undefined, 'png');
        } else if (action === 'jpg') {
          exportMenu.open = false;
          exportRaster(2, 'image/jpeg', 0.92, 'jpg', true);
        } else if (action === 'svg') {
          exportMenu.open = false;
          exportSvg();
        } else if (action === 'txt') {
          exportMenu.open = false;
          exportTxt();
        } else if (action === 'copy') {
          exportMenu.open = false;
          copyAscii();
        }
      }

      if (!exportMenu.contains(target)) exportMenu.open = false;
    });

    fileInput.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      if (file) loadImage(file);
    });
  }

  function bindDrop() {
    let depth = 0;
    const hasFiles = (event) => {
      const types = event.dataTransfer && event.dataTransfer.types;
      return types ? Array.from(types).includes('Files') : false;
    };

    window.addEventListener('dragenter', (event) => {
      if (!hasFiles(event)) return;
      event.preventDefault();
      depth += 1;
      dropVeil.hidden = false;
    });

    window.addEventListener('dragover', (event) => {
      if (!hasFiles(event)) return;
      event.preventDefault();
    });

    window.addEventListener('dragleave', (event) => {
      if (depth === 0) return;
      event.preventDefault();
      depth = Math.max(0, depth - 1);
      if (depth === 0) dropVeil.hidden = true;
    });

    window.addEventListener('drop', (event) => {
      event.preventDefault();
      depth = 0;
      dropVeil.hidden = true;
      const file = event.dataTransfer && event.dataTransfer.files ? event.dataTransfer.files[0] : null;
      if (file) loadImage(file);
    });
  }

  function bindStage() {
    stage.addEventListener(
      'wheel',
      (event) => {
        if (!image) return;
        event.preventDefault();
        zoomAt(event.clientX, event.clientY, view.z * Math.exp(-event.deltaY * 0.0015));
      },
      { passive: false },
    );

    const pointers = new Map();
    let drag = null;
    let pinch = null;

    const pinchInfo = () => {
      const [a, b] = [...pointers.values()];
      return {
        dist: Math.hypot(b.x - a.x, b.y - a.y) || 1,
        mx: (a.x + b.x) / 2,
        my: (a.y + b.y) / 2,
      };
    };

    canvas.addEventListener('pointerdown', (event) => {
      if (!image) return;
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      try {
        canvas.setPointerCapture(event.pointerId);
      } catch (error) {
        // Synthetic pointers cannot be captured.
      }

      if (pointers.size === 1) {
        drag = { x: event.clientX, y: event.clientY, vx: view.x, vy: view.y };
        pinch = null;
      } else if (pointers.size === 2) {
        drag = null;
        pinch = pinchInfo();
      }
    });

    canvas.addEventListener('pointermove', (event) => {
      if (!pointers.has(event.pointerId)) return;
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

      if (pointers.size >= 2 && pinch) {
        const next = pinchInfo();
        zoomAt(next.mx, next.my, view.z * (next.dist / pinch.dist));
        view.x += next.mx - pinch.mx;
        view.y += next.my - pinch.my;
        applyView();
        pinch = next;
      } else if (drag) {
        view.x = drag.vx + (event.clientX - drag.x);
        view.y = drag.vy + (event.clientY - drag.y);
        applyView();
      }
    });

    const endPointer = (event) => {
      if (!pointers.has(event.pointerId)) return;
      pointers.delete(event.pointerId);
      try {
        canvas.releasePointerCapture(event.pointerId);
      } catch (error) {
        // Already released.
      }

      if (pointers.size === 1) {
        const point = [...pointers.values()][0];
        drag = { x: point.x, y: point.y, vx: view.x, vy: view.y };
        pinch = null;
      } else if (pointers.size === 0) {
        drag = null;
        pinch = null;
      } else {
        pinch = pinchInfo();
      }
    };

    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('dblclick', (event) => {
      event.preventDefault();
      if (image) resetView();
    });

    window.addEventListener('keydown', (event) => {
      const target = event.target;
      const typing =
        target instanceof HTMLElement &&
        (target.tagName === 'INPUT' || target.tagName === 'SELECT' || target.tagName === 'TEXTAREA' || target.isContentEditable);

      if (event.key === 'Escape') {
        exportMenu.open = false;
        dropVeil.hidden = true;
        if (moreOpen) {
          setMore(false);
          if (lookMoreBtn) lookMoreBtn.focus();
        }
        return;
      }
      if (typing) return;

      const key = event.key.toLowerCase();
      if (key === 'o') {
        event.preventDefault();
        fileInput.click();
      } else if (event.key === '+' || event.key === '=') {
        if (!image) return;
        event.preventDefault();
        zoomAtCenter(1.25);
      } else if (event.key === '-' || event.key === '_') {
        if (!image) return;
        event.preventDefault();
        zoomAtCenter(1 / 1.25);
      } else if (key === '0' || key === 'f') {
        if (!image) return;
        event.preventDefault();
        resetView();
      }
    });
  }

  function bindResize() {
    window.addEventListener('resize', () => {
      if (image) fitCanvas();
      requestRender();
    });
  }

  /* ---------- init ---------- */

  function installGlyphFont() {
    const style = document.createElement('style');
    style.textContent = `@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:block;src:url(data:font/woff2;base64,${IBM_PLEX_MONO}) format("woff2");}`;
    document.head.appendChild(style);
    if (document.fonts && typeof document.fonts.load === 'function') {
      document.fonts.load(`400 16px ${GLYPH_FONT}`).then(() => {
        if (image) requestRender();
      }).catch(() => {});
    }
  }

  function init() {
    installGlyphFont();
    buildLooks();
    bindControls();
    bindActions();
    bindDrop();
    bindStage();
    bindResize();
    syncControls();
    setPanelTab('render');
    paintIdle();

    if (window.matchMedia('(max-width: 760px)').matches) {
      panel.classList.add('is-collapsed');
      panelGrip.setAttribute('aria-expanded', 'false');
    }
  }

  init();
})();
</script>
</body>
</html>
